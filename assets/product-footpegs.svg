<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" role="img" aria-labelledby="title desc">
  <title id="title">Foot pegs</title>
  <desc id="desc">Stylized motorbike foot peg accessory artwork.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#121518"/>
      <stop offset="100%" stop-color="#0d0f12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#ff4f4f"/>
      <stop offset="100%" stop-color="#d11d2b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="720" fill="url(#bg)"/>
  <circle cx="640" cy="160" r="120" fill="#181d21" opacity="0.9"/>
  <circle cx="640" cy="160" r="78" fill="url(#accent)" opacity="0.18"/>
  <g transform="translate(80 110)">
    <path d="M80 440 L400 440" stroke="#efefef" stroke-width="14" stroke-linecap="round"/>
    <path d="M180 440 L280 250 L320 250 L420 440" fill="none" stroke="#d9d9d9" stroke-width="12" stroke-linecap="round"/>
    <path d="M200 300 L350 300" stroke="#ff4d4d" stroke-width="12" stroke-linecap="round"/>
    <path d="M200 350 L350 350" stroke="#efefef" stroke-width="12" stroke-linecap="round"/>
    <g transform="translate(420 180)">
      <rect x="0" y="0" width="75" height="165" rx="18" fill="#171a1e" stroke="#d8d8d8" stroke-width="6"/>
      <circle cx="38" cy="36" r="16" fill="#ff4d4d"/>
      <circle cx="38" cy="92" r="16" fill="#efefef"/>
      <circle cx="38" cy="148" r="16" fill="#ff4d4d"/>
    </g>
    <rect x="0" y="0" width="110" height="52" rx="12" fill="url(#accent)"/>
    <text x="55" y="34" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">PEG</text>
  </g>
</svg>
